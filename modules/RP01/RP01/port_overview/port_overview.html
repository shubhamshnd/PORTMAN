<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Overview — RP01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Highcharts, served locally (no CDN round-trip). highcharts-more supplies
     the arearange series the forecast band uses. -->
<script src="{{ url_for('static', filename='vendor/highcharts.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/highcharts-more.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/highcharts-accessibility.min.js') }}"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* ── palette ── */
  --bg:        #D6E9FB;
  --bg-grad:   radial-gradient(1100px 460px at 100% -10%, rgba(199,224,252,.55) 0%, transparent 60%),
               radial-gradient(900px 420px at -5% 12%, rgba(207,240,247,.45) 0%, transparent 55%),
               linear-gradient(rgba(214,233,251,.26), rgba(214,233,251,.28)),
               url("{{ url_for('static', filename='img/dppl.png') }}") center center / cover no-repeat fixed,
               #D6E9FB;
  --surface:   #FFFFFF;
  --surface-t: rgba(255,255,255,.62);
  --surface-2: #F7F9FC;
  --border:    #E4E9F1;
  --border-2:  #D2DAE6;

  --text:  #0F1A2B;
  --text2: #51607A;
  --text3: #97A2B7;

  --ocean:      #1955E0;
  --ocean-deep: #0B2E77;
  --ocean-lt:   #EAF1FF;
  --ocean-bd:   #C4D7FC;

  --teal:    #0D9C93;
  --teal-deep: #0A6E68;
  --teal-lt: #E4F9F6;
  --teal-bd: #ADE8E0;

  --amber:    #C2760A;
  --amber-lt: #FFF6E5;
  --amber-bd: #F4D79B;

  --coral:    #D6482F;
  --coral-lt: #FDECE8;

  --green:    #12875B;
  --green-lt: #E7F8EF;

  --slate:    #47536B;
  --slate-lt: #F1F3F8;

  --shadow-sm: 0 1px 2px rgba(16,30,54,.04), 0 1px 6px rgba(16,30,54,.05);
  --shadow-md: 0 8px 22px rgba(16,30,54,.09);
  --shadow-lg: 0 18px 44px rgba(16,30,54,.16);
  --shadow-glow: 0 10px 30px rgba(25,85,224,.16);

  --hdr-h: 60px; --ftr-h: 32px;
  --r-sm: 7px; --r-md: 12px; --r-lg: 16px;
}
html, body {
  width:100%; height:100vh; overflow:hidden;
  font-family:'Inter',system-ui,sans-serif; background:var(--bg-grad); color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.mono { font-family:'JetBrains Mono',monospace; }
@keyframes fadeUp { from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

/* ── HEADER ── */
#hdr {
  position:sticky; top:0; left:0; right:0; height:var(--hdr-h);
  background:linear-gradient(100deg,var(--ocean-deep) 0%,#123E9E 42%,var(--teal-deep) 100%);
  display:flex; align-items:center; padding:0 20px; gap:12px; z-index:1000;
  box-shadow:0 4px 24px rgba(11,46,119,.28);
}
#hdr::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(500px 80px at 15% 0%, rgba(255,255,255,.10), transparent 70%);
  pointer-events:none;
}
#hdr-logo { height:26px; width:auto; object-fit:contain; filter:brightness(0) invert(1); position:relative; z-index:1; }
.hdr-sep  { width:1px; height:24px; background:rgba(255,255,255,.18); position:relative; z-index:1; }
.hdr-tag  {
  font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
  color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); padding:3px 10px; border-radius:20px;
  position:relative; z-index:1; backdrop-filter:blur(4px);
}
.hdr-live { display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; letter-spacing:.4px; color:#B9F3EA; text-transform:uppercase; position:relative; z-index:1; }
.hdr-live-dot { width:6px; height:6px; border-radius:50%; background:#3EF0C8; box-shadow:0 0 0 0 rgba(62,240,200,.55); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(62,240,200,.5)} 50%{box-shadow:0 0 0 6px rgba(62,240,200,0)} }
.hdr-flex { flex:1; }
.hdr-clock { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; color:#fff; letter-spacing:1.5px; position:relative; z-index:1; }
.hdr-date  { font-size:9.5px; color:rgba(255,255,255,.65); font-family:'JetBrains Mono',monospace; text-align:right; position:relative; z-index:1; }
.hdr-btn {
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.08); color:#fff;
  font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600;
  padding:7px 13px; border-radius:20px; cursor:pointer; transition:all .15s; white-space:nowrap;
  position:relative; z-index:1; backdrop-filter:blur(4px);
}

.hdr-shift {
  display:flex; flex-direction:column; align-items:flex-end; gap:1px;
  position:relative; z-index:1; padding-right:12px; border-right:1px solid rgba(255,255,255,.18);
}
.hdr-shift-lbl {
  font-family:'Space Grotesk',sans-serif; font-size:8.5px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:rgba(255,255,255,.55);
}
.hdr-shift-name {
  font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:#fff;
}

.hdr-fyend {
  flex-direction:row; align-items:center; gap:9px;
  padding:6px 16px 6px 12px; border-radius:30px; border:1px solid rgba(255,214,120,.55);
  background:linear-gradient(120deg, rgba(255,180,60,.30), rgba(255,140,20,.14));
  box-shadow:0 3px 14px rgba(194,118,10,.32), inset 0 1px 0 rgba(255,255,255,.18);
  animation: fyPulse 2.8s ease-in-out infinite;
}
@keyframes fyPulse {
  0%,100% { box-shadow:0 3px 14px rgba(194,118,10,.28), inset 0 1px 0 rgba(255,255,255,.18); }
  50%     { box-shadow:0 4px 22px rgba(255,180,60,.55), inset 0 1px 0 rgba(255,255,255,.25); }
}
.hdr-fyend-icon {
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.16); font-size:12px;
}
.hdr-fyend-text { display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
.hdr-fyend .hdr-shift-lbl {
  color:rgba(255,236,200,.85); font-weight:800;
}
.hdr-fyend .hdr-shift-name {
  font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; color:#FFEBC2;
  letter-spacing:.2px; text-shadow:0 1px 8px rgba(255,180,60,.5);
}

.hdr-btn:hover { border-color:#fff; background:rgba(255,255,255,.2); }
.hdr-btn.active { border-color:#3EF0C8; color:var(--ocean-deep); background:#3EF0C8; }

.hdr-ert-btn {
  display:inline-flex; align-items:center; gap:7px;
  background:linear-gradient(135deg, rgba(16,185,129,0.28), rgba(5,150,105,0.16));
  border:1px solid rgba(52,211,153,0.55);
  color:#fff;
  font-family:'Space Grotesk', 'Inter', sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase;
  padding:7px 14px; border-radius:20px;
  text-decoration:none; cursor:pointer;
  position:relative; z-index:1; backdrop-filter:blur(4px);
  transition:all .2s ease;
  box-shadow:0 2px 10px rgba(16,185,129,0.25);
}
.hdr-ert-btn:hover {
  background:linear-gradient(135deg, rgba(16,185,129,0.45), rgba(5,150,105,0.30));
  border-color:rgba(110,231,183,0.9);
  box-shadow:0 4px 16px rgba(16,185,129,0.45);
  transform:translateY(-1px);
  color:#fff;
  text-decoration:none;
}
.hdr-ert-dot {
  width:7px; height:7px; border-radius:50%;
  background:#10b981;
  box-shadow:0 0 0 0 rgba(16,185,129,0.7);
  animation:ertPulse 1.8s ease-in-out infinite;
}
@keyframes ertPulse {
  0%, 100% { box-shadow:0 0 0 0 rgba(16,185,129,0.75); }
  50% { box-shadow:0 0 0 6px rgba(16,185,129,0); }
}

/* ── LAYOUT ── */
#app {
  height:calc(100vh - var(--hdr-h) - var(--ftr-h));
  display:flex; gap:14px; padding:16px; align-items:stretch;
  overflow:hidden;
}

/* ── IMAGE COLUMN ── */
#image-col { width:460px; flex-shrink:0; overflow:hidden; }
.image-panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-md); animation:fadeUp .4s ease both; height:100%; display:flex; flex-direction:column; }
.panel-hdr {
  padding:12px 16px; font-family:'Space Grotesk',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;
  color:var(--text2); background:rgba(247,249,252,.5); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;
}
.panel-hdr span:first-child { display:flex; align-items:center; gap:7px; }
.panel-hdr span:first-child::before {
  content:''; width:7px; height:7px; border-radius:2px;
  background:linear-gradient(135deg,var(--ocean),var(--teal));
}
.panel-hdr .muted { font-family:'JetBrains Mono',monospace; font-weight:600; letter-spacing:0; text-transform:none; font-size:10.5px; color:var(--ocean); background:var(--ocean-lt); padding:2px 8px; border-radius:20px; }
.image-inner { width:100%; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
#berthStage { position:relative; flex:none; }
#berthStage img { width:100%; height:100%; display:block; }
.overlay { position:absolute; inset:0; }
.vessel {
  position:absolute; background:linear-gradient(160deg,#32df6e,#15803d); cursor:pointer;
  clip-path:polygon(50% 0, 100% 15%, 100% 100%, 0 100%, 0 15%);
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(21,128,61,.55));
  transition:filter .15s, transform .15s;
}
/* Berth marker: a rule down the berth's length with a tick capping each end,
   sitting just past the mooring face on the jetty side. Rotated with the berth,
   so its local +x points at the land — hence `left` puts the name on that side. */
.berth-mark {
  position:absolute; width:calc(1.6px * var(--lbl,1)); pointer-events:none;
  background:rgba(255,255,255,.85); box-shadow:0 0 3px rgba(0,0,0,.7);
}
.berth-mark::before, .berth-mark::after {   /* start / end of the berth */
  content:''; position:absolute; left:calc(-3.2px * var(--lbl,1));
  width:calc(8px * var(--lbl,1)); height:calc(1.6px * var(--lbl,1));
  background:rgba(255,255,255,.85); box-shadow:0 0 3px rgba(0,0,0,.7);
}
.berth-mark::before { top:0; }
.berth-mark::after  { bottom:0; }
.berth-mark span {
  position:absolute; left:calc(6px * var(--lbl,1)); top:50%; transform:translateY(-50%);
  font-family:'Space Grotesk',sans-serif; font-size:calc(8px * var(--lbl,1));
  font-weight:700; letter-spacing:.4px; color:#fff; white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7);
}
.vessel:hover { filter:drop-shadow(0 0 7px rgba(25,85,224,.9)); transform:scale(1.12); }
.vessel.waiting { background:linear-gradient(160deg,#43e6f1,#0891b2); filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(8,145,178,.5)); }
.vessel.completed { background:linear-gradient(160deg,#facc15,#ca8a04); filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(234,179,8,.55)); }
.upcoming {
  display:none; position:absolute; z-index:5;
  left:calc(8px * var(--lbl,1)); top:calc(8px * var(--lbl,1));
  flex-direction:column; gap:calc(3px * var(--lbl,1));
  max-width:calc(100% - 16px * var(--lbl,1)); max-height:42%; overflow-y:auto;
  padding:calc(7px * var(--lbl,1)) calc(10px * var(--lbl,1)); border-radius:var(--r-md);
  background:rgba(11,26,46,.6); backdrop-filter:blur(7px);
  border:1px solid rgba(255,255,255,.16); box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.up-lbl {
  font-family:'Space Grotesk',sans-serif; font-size:calc(8px * var(--lbl,1)); font-weight:700;
  letter-spacing:.9px; text-transform:uppercase; color:rgba(255,255,255,.6); margin-bottom:2px;
}
.up-pill { display:flex; align-items:center; gap:calc(6px * var(--lbl,1)); font-size:calc(9.5px * var(--lbl,1)); font-weight:600; color:#fff; white-space:nowrap; }
.up-pill::before { content:''; width:calc(5px * var(--lbl,1)); height:calc(5px * var(--lbl,1)); border-radius:50%; background:#FBBF24; flex-shrink:0; }
.up-pill.MBC::before { background:#43E6F1; }
.up-pill small { font-family:'JetBrains Mono',monospace; font-weight:500; color:rgba(255,255,255,.58); margin-left:auto; padding-left:8px; }

.vessel-name {
  position:absolute; transform:translateY(-50%);
  font-family:'Inter',sans-serif; font-weight:700; color:#0F1A2B; background:rgba(255,255,255,.94);
  font-size:calc(8.5px * var(--lbl,1));
  padding:calc(2px * var(--lbl,1)) calc(7px * var(--lbl,1));
  border-radius:calc(20px * var(--lbl,1));
  white-space:nowrap; cursor:pointer; line-height:1.3;
  box-shadow:0 2px 6px rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.7); transition:box-shadow .15s;
}
.vessel-name:hover { box-shadow:0 0 0 2px var(--ocean), 0 2px 6px rgba(0,0,0,.28); }
.vessel-name b { color:var(--ocean); }
#vesselCard {
  position:fixed; z-index:2000; width:230px; background:var(--surface);
  border:1px solid var(--border-2); border-radius:var(--r-md); box-shadow:var(--shadow-lg);
  padding:12px 14px; display:none;
}
#vesselCard .vc-name { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; color:var(--text); margin-bottom:4px; }
#vesselCard .vc-type {
  display:inline-block; font-size:8.5px; font-weight:700; letter-spacing:.5px;
  padding:2px 8px; border-radius:20px; margin-bottom:8px;
}
#vesselCard .vc-type.BARGE { background:var(--amber-lt); color:var(--amber); }
#vesselCard .vc-type.MBC   { background:var(--ocean-lt);  color:var(--ocean); }
#vesselCard .vc-row { display:flex; justify-content:space-between; font-size:10.5px; padding:3px 0; color:var(--text2); border-bottom:1px dashed var(--border); }
#vesselCard .vc-row:last-child { border-bottom:none; }
#vesselCard .vc-row span:last-child { font-family:'JetBrains Mono',monospace; color:var(--text); text-align:right; }

/* ── RIGHT COLUMN ── */
#right-col { flex:1; display:flex; flex-direction:column; gap:14px; min-width:0; min-height:0; overflow:hidden; }

/* Cards */
.cards-row { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; flex-shrink:0; }
.kpi-card {
  position:relative; background:var(--surface-t); backdrop-filter:blur(9px);
  border:1px solid var(--border); border-radius:var(--r-lg);
  padding:15px 16px; box-shadow:var(--shadow-sm); overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease; animation:fadeUp .4s ease both;
  display:flex; flex-direction:column;
}
.kpi-shift-row {
  display:flex; gap:6px; margin-top:auto; padding-top:8px;
  border-top:1px dashed var(--border-2);
}
.shift-pill {
  flex:1; text-align:center; font-size:9.5px; font-weight:600; color:var(--text2);
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 6px;
}
.shift-pill b {
  display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text); margin-top:2px;
}
.kpi-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.kpi-card::before {
  content:''; position:absolute; left:0; right:0; top:0; height:3px;
  background:linear-gradient(90deg, var(--kpi-accent, var(--ocean)), transparent 130%);
}
.kpi-card.hero { background:linear-gradient(165deg,rgba(255,246,229,.72) 0%,rgba(255,255,255,.6) 60%); border-color:var(--amber-bd); box-shadow:0 8px 22px rgba(194,118,10,.14); }
.kpi-label { display:flex; align-items:center; justify-content:space-between; font-family:'Space Grotesk',sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }
.kpi-icon-wrap {
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  background:var(--kpi-accent-lt, var(--ocean-lt)); color:var(--kpi-accent, var(--ocean)); flex-shrink:0;
}
.kpi-icon { width:15px; height:15px; }
.kpi-total { font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:600; color:var(--text); letter-spacing:-.3px; }
.kpi-unit { font-size:10px; color:var(--text3); font-weight:500; }


.kpi-target span:last-child { font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--kpi-accent, var(--amber)); }
.kpi-progress { margin-top:6px; height:5px; background:var(--kpi-accent-lt, var(--amber-lt)); border-radius:3px; overflow:hidden; }
.kpi-progress-fill { height:100%; background:var(--kpi-accent, var(--amber)); border-radius:3px; transition:width .6s ease; }


.kpi-target { display:flex; justify-content:space-between; align-items:baseline; margin-top:9px; font-size:10.5px; color:var(--text2); }
.kpi-target span:last-child { font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber); }
.kpi-progress { margin-top:6px; height:5px; background:var(--amber-lt); border-radius:3px; overflow:hidden; }
.kpi-progress-fill { height:100%; background:linear-gradient(90deg,var(--amber),#E08E1F); border-radius:3px; transition:width .6s ease; }
.kpi-progress-pct { margin-top:4px; font-size:9.5px; color:var(--text3); text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:3px; }
.pct-arrow { width:9px; height:9px; flex-shrink:0; }
.kpi-diff { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-2); font-size:10.5px; font-weight:600; }
.kpi-diff span:last-child { font-family:'JetBrains Mono',monospace; font-weight:700; }
.kpi-breakdown { margin-top:9px; border-top:1px dashed var(--border-2); padding-top:8px; display:flex; flex-direction:column; gap:4px; }
.kpi-row { display:flex; justify-content:space-between; font-size:10.5px; color:var(--text2); }
.kpi-row span:last-child { font-family:'JetBrains Mono',monospace; color:#000000 !important; font-weight:700; }
.kpi-empty { font-size:10.5px; color:var(--text3); }

.kpi-required-footer {
  display:flex; justify-content:space-between; align-items:baseline;
  margin-top:9px; padding-top:8px; border-top:1px dashed var(--border-2);
  font-size:10.5px; font-weight:600; color:var(--text2);
}
.kpi-required-footer span:last-child {
  font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--kpi-accent, var(--ocean));
}

/* Panels */
.panel { background:var(--surface-t); backdrop-filter:blur(9px); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-sm); animation:fadeUp .45s ease both; flex-shrink:0; }
.panel-body { padding:14px 16px; }
.mini-btn {
  border:1px solid var(--border-2); background:var(--surface); color:var(--text2);
  font-size:9.5px; font-weight:600; padding:4px 11px; border-radius:20px; cursor:pointer; transition:all .15s;
}
.mini-btn:hover { border-color:var(--ocean); color:#fff; background:var(--ocean); }

/* Delay panel */
.delay-panel { flex-shrink:0; }
.delay-headline { display:flex; align-items:center; justify-content:space-between; }
.delay-name { font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px; }
.delay-name::before { content:'⚠'; font-size:13px; color:var(--amber); background:var(--amber-lt); border:1px solid var(--amber-bd); width:22px; height:22px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; }
.delay-mins {
  font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:700; color:#fff;
  background:linear-gradient(120deg,var(--amber),#E08E1F); padding:5px 13px; border-radius:20px;
  box-shadow:0 4px 12px rgba(194,118,10,.28);
}
.delay-all { margin-top:12px; border-top:1px solid var(--border); padding-top:10px; max-height:90px; overflow-y:auto; }
.delay-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; padding:6px 4px; color:var(--text2); border-bottom:1px solid var(--surface-2); border-radius:6px; }
.delay-row:hover { background:var(--surface-2); }
.delay-row span:last-child { font-family:'JetBrains Mono',monospace; color:var(--text); font-weight:600; }
.muted { color:var(--text3); font-size:11px; }

/* ── BENTO: weather · tide · MBC ──
   Weather + tide stack in the left two columns, MBC takes the full-height
   right block. Tide and MBC render as chip grids rather than tables — one
   table row per line left most of both panels empty. */
.bento {
  flex:1; min-height:0; display:grid; gap:14px;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:minmax(0,1fr) auto;   /* tide row sizes to its chips */
}
.bento .panel { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.bento .panel-body { flex:1; min-height:0; overflow:auto; padding:11px 14px 12px; }
.bento .panel-hdr { padding:9px 14px; }
#weatherPanel { grid-area:1/1/2/3; }
#mbcPanel     { grid-area:1/3/2/6; }
#tidePanel    { grid-area:2/1/3/6; }   /* full-width strip under both */

/* Weather */
#wxBody { display:flex; flex-direction:column; justify-content:space-between; }
.wx-now { display:flex; align-items:center; gap:12px; }
.wx-now img { width:50px; height:50px; flex-shrink:0; }
.wx-temp { font-family:'JetBrains Mono',monospace; font-size:29px; font-weight:600; line-height:1; letter-spacing:-1px; color:var(--text); }
.wx-cond { font-size:11.5px; font-weight:600; color:var(--text2); margin-top:4px; }
.wx-feels { font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--text3); }
.wx-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:10px; }
.wx-metric { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:5px 7px; min-width:0; }
.wx-metric i { display:block; font-style:normal; font-family:'Space Grotesk',sans-serif; font-size:8px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--text3); }
.wx-metric b { display:block; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx-hours { display:flex; gap:5px; padding-top:9px; border-top:1px dashed var(--border-2); }
.wx-hour { flex:1; min-width:0; text-align:center; }
.wx-hour img { width:26px; height:26px; display:block; margin:0 auto; }
.wx-hour em { display:block; font-style:normal; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text3); }
.wx-hour b { display:block; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--text); }
.wx-days { display:flex; flex-direction:column; gap:5px; padding-top:9px; border-top:1px dashed var(--border-2); }
.wx-day { display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:4px 9px; }
.wx-day img { width:28px; height:28px; flex-shrink:0; }
.wx-day em { display:block; font-style:normal; font-size:9px; font-weight:600; letter-spacing:.3px; color:var(--text3); }
.wx-day b { display:block; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--text); }
.wx-day b s { text-decoration:none; color:var(--text3); font-weight:500; font-size:11px; }
.wx-day-r { margin-left:auto; text-align:right; font-family:'JetBrains Mono',monospace; }

/* Tide */
/* six fixed tracks — _fetch_tide_data returns at most 6 rows, so they never wrap */
.tide-strip { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; align-content:start; }
.tide-chip {
  background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--border-2);
  border-radius:var(--r-sm); padding:6px 9px; transition:background .15s;
}
.tide-chip:hover { background:#FBFCFE; }
.tide-chip.hw { border-left-color:var(--green); }
.tide-chip.lw { border-left-color:var(--ocean); }
.tide-chip i { display:block; font-style:normal; font-size:8.5px; font-weight:800; letter-spacing:.7px; color:var(--text3); }
.tide-chip.hw i { color:var(--green); }
.tide-chip.lw i { color:var(--ocean); }
.tide-chip b { display:block; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--text); }
.tide-chip em { font-style:normal; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text2); }

/* MBC status */
.mbc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:7px; align-content:start; }
.mbc-item {
  background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--slate);
  border-radius:var(--r-sm); padding:6px 9px; min-width:0; transition:background .15s;
}
.mbc-item:hover { background:#FBFCFE; }
.mbc-item.discharging { border-left-color:var(--green); }
.mbc-item.loading     { border-left-color:var(--teal); }
.mbc-item.loaded      { border-left-color:var(--ocean); }
.mbc-item.empty       { border-left-color:var(--slate); }
.mbc-item.na          { border-left-color:var(--amber); }
.mbc-item b { display:block; font-size:11px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mbc-item i { display:block; font-style:normal; font-size:9px; font-weight:700; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mbc-item.discharging i { color:var(--green); }
.mbc-item.loading i     { color:var(--teal-deep); }
.mbc-item.loaded i      { color:var(--ocean); }
.mbc-item.empty i       { color:var(--slate); }
.mbc-item.na i          { color:var(--amber); }
.mbc-item em { font-style:normal; font-size:9px; color:var(--text3); }

/* ── FOOTER ── */
#ftr {
  position:sticky; bottom:0; left:0; right:0; height:var(--ftr-h);
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; align-items:center; padding:0 16px; gap:12px; z-index:1000;
  box-shadow:0 -2px 10px rgba(16,30,54,.03);
}
#ftr::before {
  content:''; position:absolute; left:0; right:0; top:-2px; height:2px;
  background:linear-gradient(90deg,var(--ocean),var(--teal) 55%,transparent);
}
.ftr-lbl { font-family:'Space Grotesk',sans-serif; font-size:8.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text3); }
.ftr-val { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text2); }
.ftr-sep { width:1px; height:13px; background:var(--border); }
.ftr-bar { flex:1; height:4px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.ftr-fill { height:100%; background:linear-gradient(90deg,var(--ocean),var(--teal)); transition:width 1s linear; border-radius:3px; }

/* scrollbars */
::-webkit-scrollbar { width:7px; height:7px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:var(--text3); }

/* ── Forecast modal ──────────────────────────────────────── */
#fc-back {
  position:fixed; inset:0; z-index:3000; display:none;
  background:rgba(11,46,119,.42); backdrop-filter:blur(3px);
  align-items:center; justify-content:center; padding:24px;
}
#fc-back.on { display:flex; }
#fc-modal {
  background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
  width:min(1080px,100%); max-height:100%; display:flex; flex-direction:column;
  overflow:hidden; animation:fc-in .18s ease-out;
}
@keyframes fc-in { from { opacity:0; transform:translateY(8px) scale(.99); } }
.fc-hdr {
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  background:var(--ocean-deep); color:#fff;
}
.fc-hdr h2 { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; letter-spacing:.2px; }
.fc-hdr .sub { font-size:10.5px; color:rgba(255,255,255,.6); font-family:'JetBrains Mono',monospace; }
.fc-seg { display:flex; gap:0; margin-left:auto; border:1px solid rgba(255,255,255,.28); border-radius:20px; overflow:hidden; }
.fc-seg button {
  border:0; background:transparent; color:rgba(255,255,255,.75); cursor:pointer;
  font:600 10.5px/1 'Inter',sans-serif; letter-spacing:.5px; text-transform:uppercase; padding:7px 15px;
}
.fc-seg button.on { background:#3EF0C8; color:var(--ocean-deep); }
.fc-x {
  border:0; background:rgba(255,255,255,.12); color:#fff; cursor:pointer;
  width:28px; height:28px; border-radius:8px; font-size:16px; line-height:1;
}
.fc-x:hover { background:rgba(255,255,255,.24); }
.fc-body { padding:18px; overflow:auto; display:flex; flex-direction:column; gap:16px; }

.fc-top { display:flex; gap:18px; align-items:stretch; flex-wrap:wrap; }
.fc-prob {
  flex:0 0 210px; border-radius:var(--r-md); padding:16px 18px; text-align:center;
  border:1px solid var(--border-2); background:var(--surface-2);
}
.fc-prob .n { font-family:'Space Grotesk',sans-serif; font-size:52px; font-weight:700; line-height:1; }
.fc-prob .c { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text2); margin-top:7px; }
.fc-prob .bar { height:6px; border-radius:4px; background:var(--border); margin-top:11px; overflow:hidden; }
.fc-prob .bar i { display:block; height:100%; border-radius:4px; }

.fc-stats { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px; min-width:340px; }
.fc-stat { border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px; background:var(--surface-2); }
.fc-stat .k { font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); }
.fc-stat .v { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; color:var(--text); margin-top:3px; }
.fc-stat .u { font-size:9.5px; color:var(--text3); font-weight:500; }

#fc-chart { height:300px; }
#fc-chart-d { height:200px; }

.fc-scen { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.fc-card { border:1px solid var(--border); border-left-width:3px; border-radius:var(--r-sm); padding:10px 12px; }
.fc-card .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.fc-card .v { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; color:var(--text); margin-top:3px; }
.fc-card .d { font-size:10.5px; color:var(--text2); margin-top:2px; }
.fc-card.pess { border-left-color:var(--coral); } .fc-card.pess .k { color:var(--coral); }
.fc-card.exp  { border-left-color:var(--ocean); } .fc-card.exp  .k { color:var(--ocean); }
.fc-card.opt  { border-left-color:var(--green); } .fc-card.opt  .k { color:var(--green); }

.fc-note {
  font-size:10.5px; color:var(--text2); line-height:1.55;
  border-top:1px dashed var(--border-2); padding-top:11px;
}
.fc-note b { color:var(--text); font-weight:600; }
.fc-msg { padding:40px 20px; text-align:center; color:var(--text2); font-size:13px; }
#hdr-fyend { cursor:pointer; }
#hdr-fyend:hover { background:rgba(255,255,255,.2); }
</style>
</head>
<body>

<header id="hdr">
  <img id="hdr-logo" src="{{ url_for('static', filename='img/logo31.png') }}" alt="Logo">
  <div class="hdr-sep"></div>
  <div class="hdr-tag">RP01</div>
  <div class="hdr-live"><div class="hdr-live-dot"></div>Port Overview</div>
  <div class="hdr-flex"></div>
  <a href="http://10.5.53.233:5005/ert" target="_blank" rel="noopener noreferrer" class="hdr-btn hdr-ert-btn" id="hdr-ert-btn" title="Open Active ERT">
    <span class="hdr-ert-dot"></span>
    <span>ACTIVE ERT</span>
  </a>
  <div class="hdr-shift hdr-fyend" id="hdr-fyend" role="button" tabindex="0"
       title="Open throughput forecast"
       onclick="openForecast()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openForecast();}">
    <span class="hdr-fyend-icon">⏳</span>
    <span class="hdr-fyend-text">
      <span class="hdr-shift-name" id="hdr-fyend-days">— days</span>
      <span class="hdr-shift-lbl" id="hdr-fyend-lbl">left to hit FY target</span>
    </span>
  </div>
  <div class="hdr-shift" id="hdr-shift">
    <span class="hdr-shift-lbl">Shift In-Charge</span>
    <span class="hdr-shift-name" id="hdr-shift-name">—</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
    <div class="hdr-clock" id="hdr-clock">--:--:--</div>
    <div class="hdr-date"  id="hdr-date"></div>
  </div>
  <div class="hdr-sep"></div>
  <button class="hdr-btn" id="fs-btn" onclick="toggleFS()">⛶ Fullscreen</button>
  <button class="hdr-btn" onclick="reload()">⟳ Refresh</button>
</header>
<div id="app">

  <div id="image-col">
    <div class="image-panel">
      <div class="panel-hdr"><span>Berth Layout</span><span id="occupiedCount" class="muted">—</span></div>
      <div class="image-inner" id="berthViewport">
        <div id="berthStage">
          <img id="berthImg" src="{{ url_for('static', filename='img/Clean_berths.png') }}" alt="Port berths">
          <div class="overlay" id="berthOverlay"></div>
          <div class="upcoming" id="upcomingBox"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="vesselCard"></div>

  <div id="right-col">

    <div class="cards-row" id="cardsRow"></div>

    <div class="bento">
      <div class="panel" id="weatherPanel">
        <div class="panel-hdr"><span>Weather</span></div>
        <div class="panel-body" id="wxBody"></div>
      </div>
      <div class="panel" id="tidePanel">
        <div class="panel-hdr"><span>Tide Table</span><span id="tideCount" class="muted">—</span></div>
        <div class="panel-body tide-strip" id="tideBody"></div>
      </div>
      <div class="panel" id="mbcPanel">
        <div class="panel-hdr"><span>MBC Status</span><span id="mbcCount" class="muted">—</span></div>
        <div class="panel-body mbc-grid" id="mbcBody"></div>
      </div>
    </div>

    <div class="panel delay-panel">
      <div class="panel-hdr">
        <span>Top Delays — Today</span>
        <button id="delayToggle" class="mini-btn">Show All</button>
      </div>
      <div class="panel-body">
        <div id="delayHeadline" class="delay-headline"></div>
        <div id="delayAll" class="delay-all" style="display:none"></div>
      </div>
    </div>

  </div>

</div>

<footer id="ftr">
  <div style="display:flex;align-items:center;gap:5px">
    <span class="ftr-lbl">Refresh in</span>
    <span class="ftr-val" id="ftr-cd">60s</span>
  </div>
  <div class="ftr-bar"><div class="ftr-fill" id="ftr-fill" style="width:0%"></div></div>
  <div class="ftr-sep"></div>
  <span class="ftr-lbl">Updated</span>
  <span class="ftr-val" id="ftr-upd">—</span>
  <div class="ftr-sep"></div>
  <span class="ftr-val" style="color:var(--text3)">RP01 · Port Overview</span>
</footer>

<script>
const REFRESH = 60;
let cd = REFRESH;

/* ── CLOCK ── */
(function tick() {
  const n = new Date();
  const p = v => String(v).padStart(2,'0');
  document.getElementById('hdr-clock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('hdr-date').textContent = `${D[n.getDay()]} ${p(n.getDate())} ${M[n.getMonth()]} ${n.getFullYear()}`;
  setTimeout(tick, 1000);
})();

/* ── FY-END COUNTDOWN ── */
function fyEndInfo() {
  const n = new Date();
  const y = n.getFullYear(), m = n.getMonth() + 1; // m: 1-12
  const fyStartYear = m >= 4 ? y : y - 1;
  const fyEndYear   = fyStartYear + 1;
  const fyEnd = new Date(fyEndYear, 2, 31, 23, 59, 59, 999); // March = month index 2
  const label = `left to hit FY ${fyStartYear}-${String(fyEndYear).slice(-2)} target`;
  const diffMs = fyEnd - n;
  const days = Math.max(0, Math.ceil(diffMs / 86400000));
  return { label, days };
}
function renderFYEnd() {
  const { label, days } = fyEndInfo();
  document.getElementById('hdr-fyend-lbl').textContent = label;
  document.getElementById('hdr-fyend-days').textContent = `${days} day${days === 1 ? '' : 's'}`;
}
renderFYEnd();
setInterval(renderFYEnd, 60 * 1000);

/* ── FULLSCREEN ── */
function toggleFS() {
  const btn = document.getElementById('fs-btn');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    btn.textContent='✕ Exit'; btn.classList.add('active');
  } else {
    document.exitFullscreen().catch(()=>{});
    btn.textContent='⛶ Fullscreen'; btn.classList.remove('active');
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('fs-btn').textContent='⛶ Fullscreen';
    document.getElementById('fs-btn').classList.remove('active');
  }
});

/* ── FORMAT HELPERS ── */
function fmtNum(v) {
  if (v == null || isNaN(v)) return '0';
  return Number(v).toLocaleString('en-IN', {maximumFractionDigits:0});
}
function fmtMins(m) {
  m = Math.round(m || 0);
  const h = Math.floor(m/60), mm = m%60;
  return h > 0 ? `${h}h ${mm}m` : `${mm}m`;
}

/* ── BERTH OVERLAY (vessels only) ── */
let IMG_SIZE = [941, 1672]; // static/img/Clean_berths.png; refreshed from layout.image_size

const MAX_IMG_COL = 520;
const LBL_REF = 460;
const BERTH_MARK_PAD = 16;  // image px from the mooring face out to the berth marker
let stageW = 0, stageH = 0, lastLayout = null;

const lblScale = () => stageW / LBL_REF;

function fitStage() {
  const vp = document.getElementById('berthViewport');
  const st = document.getElementById('berthStage');
  const s = Math.min(MAX_IMG_COL / IMG_SIZE[0], vp.clientHeight / IMG_SIZE[1]);
  const w = IMG_SIZE[0] * s, h = IMG_SIZE[1] * s;
  if (w === stageW && h === stageH) return false;
  stageW = w; stageH = h;
  st.style.width  = w + 'px';
  st.style.height = h + 'px';
  st.style.setProperty('--lbl', (w / LBL_REF).toFixed(4));
  document.getElementById('image-col').style.width = (w + 2) + 'px';
  return true;
}
new ResizeObserver(() => { if (fitStage() && lastLayout) renderBerths(lastLayout); })
  .observe(document.getElementById('berthViewport'));

function placeLabels(labels, overlay) {
  const k = lblScale(), X = 4 * k, PAD = 6 * k;
  labels.sort((p, q) => p.berthY - q.berthY || p.slot - q.slot);
  const breaks = labels.filter((L, i) => i && L.b !== labels[i - 1].b).length;

  const avail = stageH - 2 * PAD;
  let pitch = 18 * k, berthGap = 8 * k;
  if (labels.length * pitch + breaks * berthGap > avail) berthGap = 0;
  if (labels.length * pitch > avail) pitch = avail / labels.length;

  let prev = -Infinity;
  labels.forEach((L, i) => {
    const gap = (i && L.b !== labels[i - 1].b) ? pitch + berthGap : pitch;
    L.y = Math.max(L.y, prev + gap);
    prev = L.y;
  });
  const spill = prev + pitch / 2 - (stageH - PAD);
  if (spill > 0) labels.forEach(L => { L.y -= spill; });

  labels.forEach(L => {
    const c = document.createElement('div');
    c.className = 'vessel-name';
    c.innerHTML = L.text;
    c.style.left = X + 'px';
    c.style.top  = L.y + 'px';
    c.addEventListener('click', ev => { ev.stopPropagation(); showVesselCard(L.a, L.b, ev); });
    overlay.appendChild(c);
    L.el = c;
  });
}

function renderBerths(layout) {
  lastLayout = layout;
  const overlay = document.getElementById('berthOverlay');
  overlay.innerHTML = '';
  const [iw, ih] = layout.image_size && layout.image_size[0] ? layout.image_size : IMG_SIZE;
  IMG_SIZE = [iw, ih];
  fitStage();
  const sx = stageW / iw;
  const labels = [];
  let occupied = 0;

  (layout.berths || []).forEach(b => {
    const th = (b.angle || 0) * Math.PI / 180;
    const cos = Math.cos(th), sin = Math.sin(th);

    // Berth marker on the jetty side (+x, past the mooring face) — the vessels
    // bank the other way, so this side is clear. Drawn for empty berths too.
    // BERTH_MARK_PAD is in image px: raise it to push the markers further ashore.
    const mx = b.cx + ((b.w || 60) / 2 + BERTH_MARK_PAD) * cos;
    const my = b.cy + ((b.w || 60) / 2 + BERTH_MARK_PAD) * sin;
    const mark = document.createElement('div');
    mark.className = 'berth-mark';
    mark.style.left   = (mx / iw * 100) + '%';
    mark.style.top    = (my / ih * 100) + '%';
    mark.style.height = ((b.h || 60) / ih * 100) + '%';   // spans the berth, ticks cap each end
    mark.style.transform = `translate(-50%,-50%) rotate(${b.angle || 0}deg)`;
    mark.innerHTML = `<span>${b.label || ''}</span>`;
    overlay.appendChild(mark);

    const assets = b.assets || [];
    if (!assets.length) return;
    occupied++;
    // th/cos/sin are declared at the top of this loop — the berth marker needs
    // them before the early return, so they must not be re-declared here.
    const bargeLen = Math.min(Math.max((b.h || 60) * 0.7, 14), 80); // barges scale with the berth
    const MBC_LEN = 80;                                             // MBCs are one fixed size

    let edge = (b.w || 60) / 2;
    assets.slice()
      .sort((p, q) => (p.tier || 0) - (q.tier || 0))
      .forEach((a, slot) => {
        const len  = a.type === 'MBC' ? MBC_LEN : bargeLen;
        const beam = Math.max(len * 0.3, 6);
        const off = edge - beam / 2;
        edge -= beam + 2;
        const px = b.cx + off * cos, py = b.cy + off * sin;

        const v = document.createElement('div');
        v.className = 'vessel' + (a.status === 'Discharge Completed' ? ' completed' : a.commenced ? '' : ' waiting');
        v.style.left   = (px / iw * 100) + '%';
        v.style.top    = (py / ih * 100) + '%';
        v.style.width  = (beam / iw * 100) + '%';
        v.style.height = (len / ih * 100) + '%';
        v.style.transform = `translate(-50%,-50%) rotate(${b.angle || 0}deg)`;
        v.addEventListener('click', ev => { ev.stopPropagation(); showVesselCard(a, b, ev); });
        overlay.appendChild(v);

        // Queue the label; placeLabels() de-collides them all together below.
        // Berth identity lives on the berth marker now, not in the chip.
        labels.push({
          y: py * sx, a: a, b: b, slot: slot, berthY: (b.cy || 0) * sx,
          text: assets.length > 1 ? `<b>${a.position || 'A/S'}</b> ${a.name}` : a.name
        });
      });
  });

  placeLabels(labels, overlay);

  document.getElementById('occupiedCount').textContent =
    `${occupied}/${(layout.berths || []).length} occupied`;
}

// Fixed display order for cargo-type breakdown rows — never re-sorted by
// quantity, so IBRM/CBRM/FLUXES/etc. always appear in the same sequence
// regardless of which had more tonnage that day. Matches TARGET_CATEGORIES
// order in port_overview/views.py. Anything not in this list (e.g. 'Finish
// Goods', 'Others') is appended after, alphabetically.
const CARGO_TYPE_ORDER = ['IBRM', 'CBRM', 'FLUXES', 'CLINKER', 'SLAG'];

function sortByCargoOrder(entries) {
  const rank = (name) => {
    const idx = CARGO_TYPE_ORDER.indexOf(String(name || '').toUpperCase());
    return idx === -1 ? CARGO_TYPE_ORDER.length : idx;
  };
  return entries.slice().sort((a, b) => {
    const ra = rank(a[0]), rb = rank(b[0]);
    if (ra !== rb) return ra - rb;
    return String(a[0]).localeCompare(String(b[0])); // tie-break for the "rest" bucket
  });
}

function renderCards(cards) {
  const row = document.getElementById('cardsRow');
  row.innerHTML = '';
  const order = ['today', 'yesterday', 'current_month', 'current_fy', 'all_time'];
  order.forEach((key, idx) => {
    const c = cards[key];
    if (!c) return;
    const entries = sortByCargoOrder(Object.entries(c.by_type || {}));
    const breakdown = entries.length
      ? entries.map(([k, v]) => `<div class="kpi-row"><span>${k}</span><span>${fmtNum(v)}</span></div>`).join('')
      : '<div class="kpi-empty">No data</div>';

    let targetBlock = '';
    if (key !== 'today' && key !== 'yesterday' && c.target !== undefined && c.target !== null) {

    const monthTarget = c.target || 0;
    const yearTarget = c.target_fy || 0;

    const target = key === "today" ? monthTarget : c.target;

    const pct = target > 0
        ? Math.round((c.total / target) * 100)
        : 0;

    const achieved = target > 0 && c.total >= target;

    const arrowColor = achieved ? "var(--green)" : "var(--coral)";

    const arrow = achieved
        ? `<svg class="pct-arrow" viewBox="0 0 24 24" fill="none" stroke="${arrowColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>`
        : `<svg class="pct-arrow" viewBox="0 0 24 24" fill="none" stroke="${arrowColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg>`;

    const diff = target - c.total;
    const diffLabel = diff > 0 ? "Shortfall" : "Surplus";
    const diffColor = diff > 0 ? "var(--coral)" : "var(--green)";

    targetBlock = `
        <div class="kpi-target">
            <span>Target</span>
            <span>${fmtNum(c.target)} MT</span>
        </div>

        <div class="kpi-progress">
            <div class="kpi-progress-fill"
                 style="width:${Math.min(100,pct)}%;background:${arrowColor}">
            </div>
        </div>

        <div class="kpi-progress-pct">
            ${arrow}
            <span style="color:${arrowColor}">
                ${pct}% achieved
            </span>
        </div>

        <div class="kpi-diff" style="color:${diffColor}">
            <span>${diffLabel}</span>
            <span>${fmtNum(Math.abs(diff))} MT</span>
        </div>
    `;

    }

    const requiredFooter = (key === 'current_month' || key === 'current_fy') && c.required_daily != null
      ? `<div class="kpi-required-footer"><span>Required Daily</span><span>${fmtNum(c.required_daily)} MT</span></div>`
      : '';

    // Shift-wise discharge for Today / Yesterday, using the same
    // per-shift totals the Shift Report's "Shift Wise Discharge" table
    // is built from (see _fetch_shift_pivot / _build_shift_wise_table in
    // shift_report/views.py) — surfaced here via cargo_cards[key].by_shift.
    let shiftBlock = '';
    if ((key === 'today' || key === 'yesterday') && c.by_shift && Object.keys(c.by_shift).length) {
      shiftBlock = `<div class="kpi-shift-row">${
        Object.entries(c.by_shift)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([s, v]) => `<span class="shift-pill">Shift ${s}<b>${fmtNum(v)}</b></span>`)
          .join('')
      }</div>`;
    }

    const div = document.createElement('div');
    div.className = 'kpi-card' + (key === 'current_fy' ? ' hero' : '');
    div.style.setProperty('--kpi-accent', CARD_ACCENTS[key] || 'var(--ocean)');
    div.style.setProperty('--kpi-accent-lt', CARD_ACCENTS_LT[key] || 'var(--ocean-lt)');
    div.style.animationDelay = (idx * 0.05) + 's';
    div.innerHTML = `
      <div class="kpi-label"><span>${key === 'all_time' ? 'CUMULATIVE VALUE' : c.label}</span><span class="kpi-icon-wrap">${CARD_ICONS[key] || ''}</span></div>
      <div class="kpi-total">${fmtNum(c.total)} <span class="kpi-unit">MT</span></div>
      ${targetBlock}
      <div class="kpi-breakdown">${breakdown}</div>
      ${requiredFooter}
      ${shiftBlock}`;
    row.appendChild(div);
  });
}

/* ── MBC STATUS ── */
function mbcStatusClass(status) {
  const s = (status || '').toUpperCase();
  if (s.startsWith('UNDER DISCHARGE')) return 'discharging';
  if (s.startsWith('UNDER LOADING'))   return 'loading';
  if (s.startsWith('LOADED'))          return 'loaded';
  if (s.startsWith('EMPTY'))           return 'empty';
  return 'na';
}
// Fixed priority order for MBC Status rows — Dharamtar-side statuses first
// (discharge in progress, then loaded/empty waiting there), working back
// through Gull Island to Jaigad/load-port, rather than the qty/name order
// the API returns. Ties (same status, multiple MBCs) fall back to name.
const MBC_STATUS_ORDER = [
  'UNDER DISCHARGE AT DHARAMTAR',
  'LOADED : WAITING AT DHARAMTAR',
  'EMPTY : WAITING AT DHARAMTAR',
  'LOADED : ON THE WAY TO DHARAMTAR',
  'LOADED : WAITING AT GULL',
  'LOADED : ON THE WAY TO GULL',
  'EMPTY : ON THE WAY TO JAIGAD',
  'EMPTY : WAITING AT JAIGAD',
  'UNDER LOADING',
  'LOADED : WAITING AT LOAD PORT',
  'EMPTY : WAITING AT LOAD PORT',
  'NA'
];

function sortByMbcStatusOrder(rows) {
  const rank = (status) => {
    const idx = MBC_STATUS_ORDER.indexOf(String(status || '').toUpperCase());
    return idx === -1 ? MBC_STATUS_ORDER.length : idx;
  };
  return rows.slice().sort((a, b) => {
    const ra = rank(a.mbc_status), rb = rank(b.mbc_status);
    if (ra !== rb) return ra - rb;
    return String(a.mbc_name || '').localeCompare(String(b.mbc_name || ''));
  });
}

function renderMBCStatus(rows) {
  const body = document.getElementById('mbcBody');
  rows = sortByMbcStatusOrder(rows || []);
  document.getElementById('mbcCount').textContent = `${rows.length} MBCs`;

  if (!rows.length) {
    body.innerHTML = '<div class="muted">No MBC data</div>';
    return;
  }

  body.innerHTML = rows.map(r => {
    const cls = mbcStatusClass(r.mbc_status);
    return `
      <div class="mbc-item ${cls}" title="${r.mbc_name} · ${r.mbc_status}${r.cargo_name ? ' · ' + r.cargo_name : ''}">
        <b>${r.mbc_name}</b>
        <i>${r.mbc_status}</i>
        ${r.cargo_name ? `<em>${r.cargo_name}</em>` : ''}
      </div>`;
  }).join('');
}

/* ── LOAD ── */
function loadData() {
  fetch('/api/module/RP01/port-overview/data')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      renderUpcoming(d.upcoming || []);
      renderBerths(d.layout || {});
      renderCards(d.cargo_cards || {});
      renderDelays(d.delays || []);
      renderTide(d.tide || []);
      renderMBCStatus(d.mbc_status || []);
      renderWeather(d.weather);
      document.getElementById('hdr-shift-name').textContent = d.shift_incharge || '—';
      document.getElementById('ftr-upd').textContent = d.as_of || '—';
    })
    .catch(e => {
      // Wall display: a silent failure leaves yesterday's numbers up looking
      // live. Say it in the footer, not just the console.
      console.error('Port overview error:', e);
      document.getElementById('ftr-upd').textContent = 'connection lost — retrying';
    });
}

  document.getElementById('ftr-cd').textContent = cd + 's';

/* ── Forecast modal ──────────────────────────────────────────
   Monte-Carlo forecast of the FY / month total, from the model in
   port_overview/forecast.py. Fetched on open and on scope change only —
   it is not part of the dashboard's polling loop.                       */
let fcScope = 'fy', fcChart = null, fcChartD = null;

function openForecast() {
  document.getElementById('fc-back').classList.add('on');
  loadForecast(fcScope);
}
function closeForecast() {
  document.getElementById('fc-back').classList.remove('on');
  if (fcChart)  { fcChart.destroy();  fcChart  = null; }
  if (fcChartD) { fcChartD.destroy(); fcChartD = null; }
}
function setForecastScope(s) {
  if (s === fcScope) return;
  fcScope = s;
  document.querySelectorAll('.fc-seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.scope === s));
  loadForecast(s);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeForecast();
});

// Reuses the dashboard's fmtNum, but shows an unset target as '—' rather than
// the '0' fmtNum returns — "0 MT" reads as a real target of zero.
const fcMT = n => (n === null || n === undefined) ? '—' : fmtNum(n);
const fcM  = n => (n === null || n === undefined) ? '—' : (n / 1e6).toFixed(2) + 'M';

function fcMsg(html) {
  document.getElementById('fc-content').style.display = 'none';
  const m = document.getElementById('fc-message');
  m.style.display = 'block';
  m.innerHTML = html;
}

function loadForecast(scope) {
  fcMsg('Running simulation…');
  fetch(`/api/module/RP01/port-overview/forecast?scope=${scope}`)
    .then(r => r.json())
    .then(renderForecast)
    .catch(e => {
      console.error('Forecast error:', e);
      fcMsg('Could not load the forecast.');
    });
}

function renderForecast(d) {
  if (!d.available) {
    fcMsg(d.reason || 'Forecast unavailable.');
    return;
  }
  document.getElementById('fc-message').style.display = 'none';
  document.getElementById('fc-content').style.display = 'flex';

  const label = d.scope === 'fy' ? `FY ${d.fy_label}` : 'This month';
  document.getElementById('fc-sub').textContent =
    `${label} · ${d.period.start} → ${d.period.end} · actuals to ${d.as_of}`;

  // Probability headline. Green / amber / coral by how likely the target is.
  const p = d.p_hit;
  const pn = document.getElementById('fc-prob-n');
  const pc = document.getElementById('fc-prob-c');
  const pb = document.getElementById('fc-prob-b');
  if (p === null || p === undefined) {
    pn.textContent = '—'; pn.style.color = 'var(--text3)';
    pc.textContent = 'No target set';
    pb.style.width = '0%';
  } else {
    const col = p >= .7 ? 'var(--green)' : p >= .4 ? 'var(--amber)' : 'var(--coral)';
    pn.textContent = Math.round(p * 100) + '%';
    pn.style.color = col;
    pc.textContent = 'chance of hitting target';
    pb.style.width = Math.max(2, p * 100) + '%';
    pb.style.background = col;
  }

  // Achieved stops at the last *complete* day, so today's part-day total gets
  // its own tile — otherwise it just looks like the number went backwards.
  const stats = [
    ['Target',          fcMT(d.target),          'MT'],
    ['Achieved',        fcMT(d.achieved),        'MT'],
    ['Days left',       d.days_left,             'incl. today'],
    ['Required / day',  fcMT(d.required_daily),  'MT'],
    ['Forecast / day',  fcMT(d.forecast_daily),  'MT'],
    ['Last 60d actual', fcMT(d.daily_rate),      'MT/day'],
  ];
  if (d.partial_today) stats.splice(2, 0, ['Booked today', fcMT(d.partial_today), 'MT so far']);
  document.getElementById('fc-stats').innerHTML = stats.map(([k, v, u]) =>
    `<div class="fc-stat"><div class="k">${k}</div>
       <div class="v">${v} <span class="u">${u}</span></div></div>`).join('');

  const vs = t => d.target ? `<div class="d">${t - d.target >= 0 ? '+' : '−'}${fcM(Math.abs(t - d.target))} vs target</div>` : '';
  document.getElementById('fc-scen').innerHTML = `
    <div class="fc-card pess"><div class="k">Pessimistic · P10</div>
      <div class="v">${fcM(d.pessimistic)}</div>${vs(d.pessimistic)}</div>
    <div class="fc-card exp"><div class="k">Expected · P50</div>
      <div class="v">${fcM(d.expected)}</div>${vs(d.expected)}</div>
    <div class="fc-card opt"><div class="k">Optimistic · P90</div>
      <div class="v">${fcM(d.optimistic)}</div>${vs(d.optimistic)}</div>`;

  const a = d.accuracy;
  document.getElementById('fc-note').innerHTML = a
    ? `Simulated 5,000 times from ${d.days_left} remaining days, using this port's
       month-of-year seasonality and a level that drifts as much as it historically has.
       <b>P10</b> is beaten 9 years in 10; <b>P90</b> only 1 in 10.
       Track record — <i>full-year</i> forecasts from this model, re-run for
       <b>${a.years}</b> past financial years from 31 July of each:
       typical error <b>±${a.mae_pct}%</b>, bias <b>${a.bias_pct >= 0 ? '+' : ''}${a.bias_pct}%</b>,
       and <b>${a.in_band} of ${a.years}</b> actual outturns landed inside the P10–P90 band.`
    : `Simulated 5,000 times from ${d.days_left} remaining days.`;

  drawForecastChart(d);
  drawDailyChart(d);
}

function drawForecastChart(d) {
  const ms = s => Date.parse(s + 'T00:00:00Z');
  const actual = (d.actual || []).map(r => [ms(r.d), r.v]);
  // Join the forecast onto the last actual point so the lines meet.
  const tail = actual.length ? [actual[actual.length - 1]] : [];
  const line = pts => tail.concat((pts || []).map(r => [ms(r.d), r.v]));
  const lo = d.p10 || [], hi = d.p90 || [];
  const band = (tail.length ? [[tail[0][0], tail[0][1], tail[0][1]]] : [])
    .concat(lo.map((r, i) => [ms(r.d), r.v, (hi[i] || r).v]));

  if (fcChart) fcChart.destroy();
  fcChart = Highcharts.chart('fc-chart', {
    chart: { spacing: [8, 4, 4, 4], style: { fontFamily: 'Inter, sans-serif' } },
    title: { text: null }, credits: { enabled: false },
    accessibility: {
      description: `Cumulative throughput for ${d.scope === 'fy' ? 'the financial year' : 'the month'},` +
                   ` actual to ${d.as_of} then forecast to ${d.period.end}.`
    },
    legend: { itemStyle: { fontSize: '11px', fontWeight: '600', color: '#51607A' } },
    xAxis: { type: 'datetime', lineColor: '#D2DAE6', tickColor: '#D2DAE6',
             labels: { style: { fontSize: '10px', color: '#97A2B7' } },
             plotLines: tail.length ? [{
               value: tail[0][0], color: '#97A2B7', width: 1, dashStyle: 'Dot',
               label: { text: 'today', rotation: 0, y: 12,
                        style: { fontSize: '9px', color: '#97A2B7' } } }] : [] },
    yAxis: {
      title: { text: 'Cumulative MT', style: { fontSize: '10px', color: '#97A2B7' } },
      gridLineColor: '#EDF1F7',
      labels: { formatter() { return (this.value / 1e6).toFixed(1) + 'M'; },
                style: { fontSize: '10px', color: '#97A2B7' } },
      plotLines: d.target ? [{
        value: d.target, color: '#D6482F', width: 2, dashStyle: 'Dash', zIndex: 5,
        label: { text: 'Target ' + (d.target / 1e6).toFixed(2) + 'M', align: 'right', x: -6, y: -6,
                 style: { fontSize: '10px', fontWeight: '600', color: '#D6482F' } } }] : []
    },
    tooltip: {
      shared: true, valueDecimals: 0,
      xDateFormat: '%e %b %Y',
      pointFormatter() {
        return `<span style="color:${this.color}">●</span> ${this.series.name}: <b>` +
               (this.high !== undefined
                  ? (this.low / 1e6).toFixed(2) + 'M – ' + (this.high / 1e6).toFixed(2) + 'M'
                  : (this.y / 1e6).toFixed(2) + 'M') + '</b><br/>';
      }
    },
    plotOptions: { series: { marker: { enabled: false }, animation: false } },
    series: [
      { name: 'P10 – P90 range', type: 'arearange', data: band,
        color: '#1955E0', fillOpacity: .13, lineWidth: 0, zIndex: 0 },
      { name: 'Forecast (P50)', type: 'line', data: line(d.p50),
        color: '#1955E0', dashStyle: 'ShortDash', lineWidth: 2, zIndex: 2 },
      { name: 'Actual', type: 'line', data: actual,
        color: '#0B2E77', lineWidth: 2.5, zIndex: 3 }
    ]
  });
}

// Same simulation, un-cumulated: what we discharge on a given day. The
// cumulative chart answers "do we get there"; this one answers "at what rate",
// which is the number a shift plan is actually built from.
function drawDailyChart(d) {
  const ms = s => Date.parse(s + 'T00:00:00Z');
  const act = (d.daily_actual || []).map(r => [ms(r.d), r.v]);
  const p50 = (d.daily_p50 || []).map(r => [ms(r.d), r.v]);
  const lo = d.daily_p10 || [], hi = d.daily_p90 || [];
  const band = lo.map((r, i) => [ms(r.d), r.v, (hi[i] || r).v]);
  const k = v => (v / 1e3).toFixed(0) + 'k';

  if (fcChartD) fcChartD.destroy();
  fcChartD = Highcharts.chart('fc-chart-d', {
    chart: { spacing: [8, 4, 4, 4], style: { fontFamily: 'Inter, sans-serif' } },
    title: { text: 'Daily discharge', align: 'left', x: 2,
             style: { fontSize: '11px', fontWeight: '600', color: '#51607A' } },
    credits: { enabled: false },
    accessibility: {
      description: `Discharge per day, actual to ${d.as_of} then forecast to ${d.period.end}.`
    },
    legend: { enabled: false },
    xAxis: { type: 'datetime', lineColor: '#D2DAE6', tickColor: '#D2DAE6',
             labels: { style: { fontSize: '10px', color: '#97A2B7' } } },
    yAxis: {
      title: { text: 'MT / day', style: { fontSize: '10px', color: '#97A2B7' } },
      gridLineColor: '#EDF1F7', min: 0,
      labels: { formatter() { return k(this.value); },
                style: { fontSize: '10px', color: '#97A2B7' } },
      plotLines: d.required_daily ? [{
        value: d.required_daily, color: '#D6482F', width: 2, dashStyle: 'Dash', zIndex: 5,
        label: { text: 'Required ' + k(d.required_daily) + '/day', align: 'right', x: -6, y: -5,
                 style: { fontSize: '10px', fontWeight: '600', color: '#D6482F' } } }] : []
    },
    tooltip: {
      shared: true, xDateFormat: '%e %b %Y',
      pointFormatter() {
        return `<span style="color:${this.color}">●</span> ${this.series.name}: <b>` +
               (this.high !== undefined ? k(this.low) + ' – ' + k(this.high)
                                        : fmtNum(Math.round(this.y)) + ' MT') + '</b><br/>';
      }
    },
    plotOptions: { series: { animation: false, marker: { enabled: false } },
                   column: { borderWidth: 0, groupPadding: .04, pointPadding: .02 } },
    series: [
      { name: 'P10 – P90 range', type: 'arearange', data: band,
        color: '#1955E0', fillOpacity: .13, lineWidth: 0, zIndex: 0 },
      { name: 'Forecast / day (P50)', type: 'line', data: p50,
        color: '#1955E0', dashStyle: 'ShortDash', lineWidth: 2, zIndex: 3 },
      { name: 'Actual / day', type: 'column', data: act, color: '#0B2E77', zIndex: 1 }
    ]
  });
}
</script>

<div id="fc-back" onclick="if(event.target===this)closeForecast()">
  <div id="fc-modal" role="dialog" aria-modal="true" aria-label="Throughput forecast">
    <div class="fc-hdr">
      <div>
        <h2>Throughput Forecast</h2>
        <div class="sub" id="fc-sub">—</div>
      </div>
      <div class="fc-seg">
        <button data-scope="fy"    class="on" onclick="setForecastScope('fy')">Financial year</button>
        <button data-scope="month"           onclick="setForecastScope('month')">This month</button>
      </div>
      <button class="fc-x" onclick="closeForecast()" aria-label="Close">×</button>
    </div>
    <div class="fc-body">
      <div class="fc-msg" id="fc-message">Running simulation…</div>
      <div id="fc-content" style="display:none;flex-direction:column;gap:16px">
        <div class="fc-top">
          <div class="fc-prob">
            <div class="n" id="fc-prob-n">—</div>
            <div class="c" id="fc-prob-c">chance of hitting target</div>
            <div class="bar"><i id="fc-prob-b"></i></div>
          </div>
          <div class="fc-stats" id="fc-stats"></div>
        </div>
        <div id="fc-chart"></div>
        <div id="fc-chart-d"></div>
        <div class="fc-scen" id="fc-scen"></div>
        <div class="fc-note" id="fc-note"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
