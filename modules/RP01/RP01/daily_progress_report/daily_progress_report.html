{% extends "base.html" %}

{% block title %}Daily Progress Report - RP01{% endblock %}

{% block head %}

<style>

/* ─────────────────────────────────────────────
   PAGE HEADER
───────────────────────────────────────────── */

.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border-color);
}

.page-header h2 {
    margin: 0;
    font-size: 18px;
    color: var(--text-primary);
}

.module-badge {
    background: #4a90d9;
    color: #fff;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.breadcrumb {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 14px;
}

.breadcrumb a {
    color: #4a90d9;
    text-decoration: none;
}

.breadcrumb a:hover {
    text-decoration: underline;
}

.monthly-report-table th,
.monthly-report-table td{
    border:1px solid #000;
    padding:6px;
}

.monthly-report-table thead th{
    background:#fff200;
    color:red;
    font-weight:bold;
    text-align:center;
    vertical-align:middle;
}

/* ─────────────────────────────────────────────
   FILTER SECTION
───────────────────────────────────────────── */

.filter-card {
    background: #f8f9fb;
    border: 1px solid #d9dee7;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 20px;
}

.filter-row {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filter-group label {
    font-size: 12px;
    font-weight: 700;
    color: #667085;
    text-transform: uppercase;
}

.filter-group input {
    width: 180px;
    height: 38px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 14px;
    background: #ffffff;
}

.filter-btn {
    height: 38px;
    min-width: 90px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.filter-btn.apply {
    background: #4a90d9;
    color: white;
}

.filter-btn.reset {
    background: #ffffff;
    color: #667085;
    border: 1px solid #d0d5dd;
}

/* ─────────────────────────────────────────────
   REPORT TABLE
───────────────────────────────────────────── */

.report-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 14px;
    background: #fff;
}

.report-table td,
.report-table th {
    border: 1px solid #d3d3d3;
    padding: 8px 10px;
    vertical-align: middle;
}

.report-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: #f7f7f7;
    padding: 12px;
}

.report-date-row {
    background: #fcfcfc;
    font-weight: 600;
}

.left-label {
    width: 180px;
    font-weight: 600;
    background: #fafafa;
    white-space: nowrap;
}

.vessel-header {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    background: #eaf2fb;
}

/* ── Status badges ───────────────────────────── */

.badge-inprogress {
    display: inline-block;
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffc107;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}

.badge-completed {
    display: inline-block;
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #6ee7b7;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}

/* ─────────────────────────────────────────────
   REPORT CARD
───────────────────────────────────────────── */

.report-card {
    background: #ffffff;
    border: 1px solid #d9dee7;
    border-radius: 8px;
    overflow: hidden;
}

.report-header {
    padding: 16px 20px;
    border-bottom: 1px solid #d9dee7;
    background: #f8f9fb;
    font-size: 16px;
    font-weight: 700;
    color: #344054;
}

.report-body {
    padding: 20px;
    overflow-x: auto;
}

.report-section {
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    padding: 16px;
    background: #ffffff;
    margin-bottom: 24px;
}

.report-section h4 {
    margin-bottom: 12px;
    color: #344054;
    font-size: 15px;
}

/* ─────────────────────────────────────────────
   LOADING SPINNER
───────────────────────────────────────────── */

.loading-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 30px 20px;
    color: #667085;
    font-size: 14px;
}

.spinner {
    width: 20px;
    height: 20px;
    border: 3px solid #d0d5dd;
    border-top-color: #4a90d9;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

</style>

{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Daily Progress Report</h2>
    <span class="module-badge">RP01</span>
</div>

<div class="breadcrumb">
    <a href="/module/RP01/">Reports</a>
    &rsaquo;
    Daily Progress Report
</div>

<!-- FILTER SECTION -->
<div class="filter-card">
    <div class="filter-row">

        <div class="filter-group">
            <label>Report Date</label>
            <input type="date" id="report-date">
        </div>

        <button id="apply-filter-btn" class="filter-btn apply">
            Apply
        </button>

        <button id="reset-filter-btn" class="filter-btn reset">
            Reset
        </button>
        <button
    type="button"
    class="btn btn-primary"
    id="download_excel_btn"
>
    Download Excel
</button>

    </div>
</div>

<!-- REPORT OUTPUT -->
<div id="report-container" class="report-card" style="display:none;"></div>

<script>

document
    .getElementById('apply-filter-btn')
    .addEventListener('click', loadReport);

document
    .getElementById('reset-filter-btn')
    .addEventListener('click', function () {
        document.getElementById('report-date').value = '';
        const container = document.getElementById('report-container');
        container.style.display = 'none';
        container.innerHTML = '';
    });


async function loadReport() {

    const reportDate = document.getElementById('report-date').value;

    if (!reportDate) {
        alert('Please select a report date');
        return;
    }

    const container = document.getElementById('report-container');

    // Show loading state
    container.style.display = 'block';
    container.innerHTML = `
        <div class="loading-wrap">
            <div class="spinner"></div>
            Loading report…
        </div>
    `;

    try {

        const response = await fetch(
            `/api/module/RP01/daily_progress_report?report_date=${reportDate}`
        );

        const result = await response.json();

        if (!result.success) {
            container.innerHTML = `
                <div class="report-body" style="color:#c0392b;">
                    Error: ${result.message}
                </div>
            `;
            return;
        }

        renderReport(result.data, reportDate);

// ALWAYS LOAD MONTHLY REPORT SECOND
await loadMonthlyReport(reportDate);

// ALWAYS LOAD VESSEL DELAY THIRD
await loadVesselDelayReport(reportDate);

console.log("VESSEL DELAY REPORT COMPLETED");

await loadBargeStatusReport(reportDate);
console.log("BARGE STATUS REPORT FUNCTION CALLED");

await loadBargeDischargeReport(reportDate);

await loadMbcReport(reportDate);

await loadArrivedVesselReport(reportDate);

await loadMbcArrivedReport(reportDate);

await loadUpcomingVesselReport(reportDate);

await loadMbcExpectedReport(reportDate);

await loadTideTable(reportDate);

await loadVesselDischargeSummary(reportDate);



    } catch (err) {

        container.innerHTML = `
            <div class="report-body" style="color:#c0392b;">
                Unexpected error: ${err.message}
            </div>
        `;
    }
}


function renderReport(data, reportDate) {

    const container = document.getElementById('report-container');

    if (!data.length) {
        container.style.display = 'block';
        container.innerHTML = `
            <div class="report-body">
                No vessels found for the selected date.
            </div>
        `;
        return;
    }

    // ─────────────────────────────────────────────
    // SORT:
    // Completed vessels first
    // Then still-discharging vessels, chronologically
    // by discharge start time (matches backend sequencing)
    // ─────────────────────────────────────────────

    const parseDt = (s) => {
        if (!s) return Infinity;
        const [datePart, timePart] = s.split(' ');
        const [d, m, y] = datePart.split('-').map(Number);
        const [hh, mm] = (timePart || '00:00').split(':').map(Number);
        return new Date(y, m - 1, d, hh, mm).getTime();
    };

    data.sort((a, b) => {

    const aTime = parseDt(a.discharge_commenced);
    const bTime = parseDt(b.discharge_commenced);

    // Earliest discharge commenced first
    if (aTime !== bTime) {
        return aTime - bTime;
    }

    // If same commencement time, sort alphabetically
    return (a.vessel_name || "").localeCompare(
        b.vessel_name || "",
        undefined,
        { sensitivity: "base" }
    );

});

    // ── Build one column per vessel ──────────────────────────────

    let vesselHeaders         = '';
    let cargoRow              = '';
    let blQtyRow              = '';
    let arrivedMflRow         = '';
    let arrivedMbptRow        = '';
    let dischargeCommencedRow = '';
    let preBerthingDelayRow   = '';
    let dischargeCompletedRow = '';

    data.forEach(v => {

        vesselHeaders += `
            <td class="vessel-header">
                ${v.vessel_name || '&mdash;'}
            </td>
        `;

        cargoRow += `
            <td style="text-align:center; font-size:14px;">
                ${v.cargo_name || '&mdash;'}
            </td>
        `;

        blQtyRow += `
            <td style="text-align:center; font-weight:700; font-size:14px;">
                ${v.bl_quantity
                    ? Number(v.bl_quantity).toLocaleString('en-IN')
                    : '&mdash;'}
            </td>
        `;

        arrivedMflRow += `
            <td style="text-align:center;">
                ${v.arrived_mfl || '&mdash;'}
            </td>
        `;

        arrivedMbptRow += `
            <td style="text-align:center;">
                ${v.arrived_mbpt || '&mdash;'}
            </td>
        `;

        dischargeCommencedRow += `
            <td style="text-align:center;">
                ${v.discharge_commenced || '&mdash;'}
            </td>
        `;

        preBerthingDelayRow += `
            <td style="text-align:center; font-weight:600;">
                ${v.pre_berthing_delay || '&mdash;'}
            </td>
        `;

        dischargeCompletedRow += `
            <td style="text-align:center;">
                ${v.discharge_completed || '-'}
            </td>
        `;
    });

    const colCount = data.length + 1;

    container.style.display = 'block';

    container.innerHTML = `

        <div class="report-body">

            <table class="report-table">

                <tr>
                    <th colspan="${colCount}" class="report-title">
                        DAILY REPORT OF JSW DHARAMTAR PORT OPERATIONS
                    </th>
                </tr>

                <tr class="report-date-row">
                    <td
                        colspan="${colCount}"
                        style="text-align:center; font-size:15px; padding:10px;">

                        <b>Report Date :</b> ${formatDate(reportDate)}

                    </td>
                </tr>

                <tr>
                    <td class="left-label">Vessel Name</td>
                    ${vesselHeaders}
                </tr>

                <tr>
                    <td class="left-label">Cargo / Source</td>
                    ${cargoRow}
                </tr>

                <tr>
                    <td class="left-label">B/L QTY. (MT)</td>
                    ${blQtyRow}
                </tr>

                <tr>
                    <td class="left-label">Arrived at MFL</td>
                    ${arrivedMflRow}
                </tr>

                <tr>
                    <td class="left-label">Arrived at MbPT</td>
                    ${arrivedMbptRow}
                </tr>

                <tr>
                    <td class="left-label">Discharge Commenced</td>
                    ${dischargeCommencedRow}
                </tr>

                <tr>
                    <td class="left-label">Pre-Berthing Delay</td>
                    ${preBerthingDelayRow}
                </tr>

                <tr>
                    <td class="left-label">Discharge Completed</td>
                    ${dischargeCompletedRow}
                </tr>

            </table>

        </div>
    `;
}

function renderMonthlyReport(data) {

    const container =
        document.getElementById('report-container');

    if (!data || !data.length) {
        return;
    }

    const vesselList = data;

    console.log("Monthly Order");

    vesselList.forEach(v => {
        console.log(v.vessel_seq, v.vessel_name);
    });


    // ============================================================
    // COLLECT UNIQUE DATES
    // ============================================================

    const uniqueDatesSet = new Set();

    vesselList.forEach(vessel => {

        (vessel.daily_data || []).forEach(day => {

            if (day.date_day) {
                uniqueDatesSet.add(day.date_day);
            }

        });

    });


    // ============================================================
    // SORT DATES
    // ============================================================

    const uniqueDates =
        Array.from(uniqueDatesSet).sort((a, b) => {

            const [ad, am, ay] =
                a.split('-').map(Number);

            const [bd, bm, by] =
                b.split('-').map(Number);

            return new Date(ay, am - 1, ad)
                -
                new Date(by, bm - 1, bd);
        });


    // ============================================================
    // NO DATA
    // ============================================================

    if (!uniqueDates.length) {

        container.innerHTML += `

            <div
                class="report-section"
                style="margin-top:20px;"
            >

                <h4>
                    Monthly Cargo Discharge Report
                </h4>

                <p style="color:red;">
                    No discharge data found for this period.
                </p>

            </div>

        `;

        return;
    }


    // ============================================================
    // START MONTHLY REPORT
    // ============================================================

    let html = `

        <div
            class="report-section"
            style="margin-top:20px;"
        >

            <h4>
                Monthly Cargo Discharge Report
            </h4>

            <div style="overflow-x:auto;">

                <table
                    class="report-table monthly-report-table"
                    style="
                        border-collapse:collapse;
                        width:max-content;
                        min-width:100%;
                        table-layout:fixed;
                    "
                >

                    <thead>

                        <!-- =================================================
                             MAIN HEADER
                        ================================================== -->

                        <tr
                            style="
                                background:#fff200;
                                color:red;
                                font-weight:700;
                                text-align:center;
                            "
                        >

                            <th
                                rowspan="2"
                                style="
                                    min-width:90px;
                                    vertical-align:middle;
                                    text-align:center;
                                "
                            >
                                Date / Day
                            </th>


                            <th
                                rowspan="2"
                                style="
                                    min-width:90px;
                                    vertical-align:middle;
                                    text-align:center;
                                "
                            >
                                Total MV
                            </th>

    `;


    // ============================================================
    // VESSEL HEADERS
    // ============================================================

    vesselList.forEach(vessel => {

        html += `

            <th
                colspan="3"
                style="
                    text-align:center;
                    vertical-align:middle;
                    min-width:300px;
                    white-space:nowrap;
                "
            >
                ${vessel.vessel_name}
            </th>

        `;

    });


    html += `

                        </tr>


                        <!-- =================================================
                             SECOND HEADER
                        ================================================== -->

                        <tr
                            style="
                                background:#fff200;
                                color:red;
                                font-weight:700;
                                text-align:center;
                            "
                        >

    `;


    vesselList.forEach(vessel => {

        html += `

            <th
                style="
                    width:140px;
                    text-align:center;
                "
            >
                ${vessel.cargo_name || 'Cargo / Source'}
            </th>


            <th
                style="
                    width:80px;
                    text-align:center;
                "
            >
                Qty in MT
            </th>


            <th
                style="
                    width:80px;
                    text-align:center;
                "
            >
                W/W Hrs.
            </th>

        `;

    });


    html += `

                        </tr>

                    </thead>


                    <tbody>

    `;


    // ============================================================
    // VESSEL TOTAL ACCUMULATORS
    //
    // IMPORTANT:
    // grandTotalQty has been removed because the TOTAL row
    // is no longer required.
    // ============================================================

    const vesselTotals =
        vesselList.map(() => 0);


    // ============================================================
    // DAILY ROWS
    // ============================================================

    uniqueDates.forEach(currentDate => {

        let totalMvQty = 0;


        // --------------------------------------------------------
        // Total MV for the current day
        // --------------------------------------------------------

        const firstVesselDay =
            (vesselList[0].daily_data || [])
                .find(
                    d => d.date_day === currentDate
                );


        if (firstVesselDay) {

            totalMvQty =
                Number(
                    firstVesselDay.total_mv || 0
                );

        }


        // --------------------------------------------------------
        // DAILY ROW
        // --------------------------------------------------------

        html += `

            <tr>

                <td
                    style="
                        text-align:center;
                    "
                >
                    ${currentDate}
                </td>


                <td
                    style="
                        text-align:right;
                    "
                >
                    ${
                        totalMvQty > 0
                            ? totalMvQty.toLocaleString('en-IN')
                            : '-'
                    }
                </td>

        `;


        // --------------------------------------------------------
        // VESSEL DATA
        // --------------------------------------------------------

        vesselList.forEach((vessel, idx) => {

            const dayData =
                (vessel.daily_data || [])
                    .find(
                        d => d.date_day === currentDate
                    );


            const qty =
                dayData
                    ? Number(dayData.total_qty || 0)
                    : 0;


            // Keep vessel totals for other calculations
            vesselTotals[idx] += qty;


            html += `

                <td
                    style="
                        text-align:left;
                    "
                >
                    ${vessel.cargo_name || '-'}
                </td>


                <td
                    style="
                        text-align:right;
                    "
                >
                    ${
                        qty > 0
                            ? qty.toLocaleString('en-IN')
                            : '-'
                    }
                </td>


                <td
                    style="
                        text-align:center;
                    "
                >
                    ${
                        qty > 0
                            ? (dayData.ww_hrs || '-')
                            : '-'
                    }
                </td>

            `;

        });


        html += `

            </tr>

        `;

    });


    // ============================================================
    // TOTAL ROW REMOVED
    //
    // The old block:
    //
    // <tr>
    //     TOTAL
    //     grandTotalQty
    //     vesselTotals
    // </tr>
    //
    // has intentionally been removed.
    // ============================================================



    // ============================================================
    // BALANCE ON BOARD
    // ============================================================

    html += `

        <tr>

            <td></td>

            <td></td>

    `;


    vesselList.forEach(vessel => {

        html += `

            <td
                style="
                    font-weight:600;
                "
            >
                Balance on Board
            </td>


            <td
                style="
                    text-align:right;
                "
            >
                ${
                    Number(
                        vessel.balance_on_board || 0
                    ).toLocaleString('en-IN')
                }
            </td>


            <td></td>

        `;

    });


    html += `

        </tr>

    `;


    // ============================================================
    // AVG DISCHARGE RATE
    // ============================================================

    html += `

        <tr>

            <td></td>

            <td></td>

    `;


    vesselList.forEach(vessel => {

        html += `

            <td
                style="
                    font-weight:bold;
                "
            >
                Avg Discharge Rate PWWD
            </td>


            <td
                style="
                    text-align:right;
                    font-weight:bold;
                "
            >
                ${
                    Number(
                        vessel.avg_discharge_rate || 0
                    ).toLocaleString('en-IN')
                }
            </td>


            <td></td>

        `;

    });


    html += `

        </tr>

    `;


    // ============================================================
    // HOOKS AVAILABLE
    // ============================================================

    html += `

        <tr>

            <td></td>

            <td></td>

    `;


    vesselList.forEach(vessel => {

        html += `

            <td>
                Hooks Available
            </td>


            <td
                style="
                    text-align:center;
                "
            >
                ${vessel.hooks_available || '4'}
            </td>


            <td></td>

        `;

    });


    html += `

        </tr>

    `;


    // ============================================================
    // VESSEL DELAY DETAILS
    //
    // This remains INSIDE the same monthly table so that
    // each vessel's delay appears directly underneath
    // that vessel's 3 columns.
    // ============================================================

    html += `

        <tr id="vessel-delay-row">

            <td
                colspan="2"
                style="
                    vertical-align:top;
                    font-weight:700;
                    background:#f2f2f2;
                    text-align:left;
                "
            >
                Vessel Delay Details
            </td>

    `;


    vesselList.forEach(vessel => {

        html += `

            <td
                colspan="3"
                class="vessel-delay-cell"
                data-vessel-name="${vessel.vessel_name || ''}"
                style="
                    vertical-align:top;
                    padding:8px;
                    min-width:300px;
                    background:#ffffff;
                    font-size:14px;
                    white-space:normal;
                "
            >
            </td>

        `;

    });


    html += `

        </tr>

    `;


    // ============================================================
    // CLOSE TABLE
    // ============================================================

    html += `

                    </tbody>

                </table>

            </div>

        </div>

    `;


    container.innerHTML += html;
}
async function loadMonthlyReport(reportDate) {

    try {

        const response = await fetch(
            `/api/module/RP01/monthly_cargo_report?report_date=${reportDate}`
        );

        const result = await response.json();

        if (!result.success) {
            console.warn('Monthly report failed:', result.message);
            return;
        }

        renderMonthlyReport(result.data);

    } catch (err) {
        console.warn('Monthly report error:', err.message);
    }
}

async function loadVesselDelayReport(reportDate) {

    console.log("========== VESSEL DELAY START ==========");

    console.log("REPORT DATE:", reportDate);

    try {

        const apiUrl =
            `/api/module/RP01/vessel_delay_report?report_date=${reportDate}`;

        console.log("API URL:", apiUrl);

        const response = await fetch(apiUrl);

        console.log("FETCH RESPONSE:", response);

        const result = await response.json();

        console.log("VESSEL DELAY API RESULT:", result);

        if (!result.success) {

            console.error(
                'Vessel delay report failed:',
                result.message
            );

            const container =
                document.getElementById('report-container');

            container.innerHTML += `

                <div class="report-section">

                    <div style="
                        color:red;
                        font-weight:700;
                    ">

                        Vessel Delay Report Failed :
                        ${result.message}

                    </div>

                </div>
            `;

            return;
        }

        console.log(
            "VESSEL DELAY DATA:",
            result.data
        );

        renderVesselDelayReport(result.data);

function renderVesselDelayReport(data) {

    console.log("========== RENDER VESSEL DELAY ==========");

    const container =
        document.getElementById('report-container');

    if (!container) {
        return;
    }

    // ------------------------------------------------------------
    // Find the delay cells already created inside the
    // Monthly Cargo Discharge Report.
    // ------------------------------------------------------------

    const delayCells =
        document.querySelectorAll('.vessel-delay-cell');

    if (!delayCells || !delayCells.length) {

        console.warn(
            "Vessel delay row not found in Monthly Cargo Discharge Report"
        );

        return;
    }

    // ------------------------------------------------------------
    // Clear ALL delay cells first.
    // This guarantees that vessels without delays remain blank.
    // ------------------------------------------------------------

    delayCells.forEach(cell => {

        cell.innerHTML = '';

        cell.style.background = '#ffffff';

    });


    // ------------------------------------------------------------
    // If API returns no delay data,
    // keep all cells blank.
    // DO NOT hide the vessels.
    // ------------------------------------------------------------

    if (!Array.isArray(data) || data.length === 0) {

        console.log("No vessel delays found.");

        return;
    }


    // ------------------------------------------------------------
    // Match API delay data with the vessel already displayed
    // in the Monthly Cargo Discharge Report.
    // ------------------------------------------------------------

    data.forEach(vesselDelay => {

        const vesselName =
            (vesselDelay.vessel_name || '')
            .trim()
            .toLowerCase();

        if (!vesselName) {
            return;
        }


        // Find the exact vessel column in monthly report
        let targetCell = null;

        delayCells.forEach(cell => {

            const cellVessel =
                (cell.dataset.vesselName || '')
                .trim()
                .toLowerCase();

            if (cellVessel === vesselName) {
                targetCell = cell;
            }

        });


        // Vessel exists in delay API but not in monthly report
        if (!targetCell) {

            console.warn(
                "Delay vessel not found in monthly report:",
                vesselDelay.vessel_name
            );

            return;
        }


        // --------------------------------------------------------
        // Build delay content
        // --------------------------------------------------------

        let delayContent = '';


        (vesselDelay.delays || []).forEach(delay => {

            if (!delay || !delay.delay_name) {
                return;
            }


            delayContent += `

                <div style="
                    margin-bottom:8px;
                ">

                    <div style="
                        font-weight:700;
                        color:#c62828;
                        margin-bottom:2px;
                    ">
                        ${delay.delay_name} :
                    </div>

                    <div style="
                        padding-left:10px;
                        white-space:pre-line;
                        line-height:1.3;
                        font-size:14px;
                    ">
                        ${delay.crane_details || ''}
                    </div>

                </div>

            `;
        });


        // --------------------------------------------------------
        // Only show yellow background when there is
        // an actual delay.
        // --------------------------------------------------------

        if (delayContent.trim()) {

            targetCell.innerHTML = delayContent;

            targetCell.style.background = '#fff9c4';

        } else {

            // No delay = completely blank
            targetCell.innerHTML = '';

            targetCell.style.background = '#ffffff';
        }

    });


    console.log("========== VESSEL DELAY RENDERED ==========");
}

function renderBargeStatusReport(data) {

    const container = document.getElementById("report-container");

    if (!data || Object.keys(data).length === 0)
        return;

    const editableRows = [
        "r19_waiting_loaded",
        "empty_at_gull_r19",
        "in_transit_jetty_to_mv",
        "breakdown",
        "remarks"
    ];

    const statuses = [
        ["at_jetty", "At Jetty - Under Discharge / Loading"],
        ["waiting_discharge", "At Jetty - Waiting for Discharge"],
        ["r19_waiting_loaded", "At R-19 - Waiting (Loaded)"],
        ["at_gull_loaded", "At Gull - Waiting (Loaded)"],
        ["under_loading", "Under Loading at MV"],
        ["waiting_loading", "Waiting for loading"],
        ["waiting_empty_jetty", "Waiting at Jetty - Empty"],
        ["empty_at_gull_r19", "Empty at Gull / R-19"],
        ["in_transit_jetty_to_mv", "In transit - from Jetty to MV"],
        ["breakdown", "Breakdown / Off Hired / Coastal"],
        ["remarks", "Remarks"]
    ];

    const savedEdits = JSON.parse(localStorage.getItem("bargeStatusEdits") || "{}");

    let html = `
    <div id="barge-status-section" class="report-section" style="margin-top:30px">

        <h4>Barge Status Report</h4>

        <div style="overflow-x:auto">

        <table class="report-table">

            <tr style="background:#fff200;color:red;font-weight:bold">

                <th>Status</th>
    `;

    Object.keys(data).forEach(ldudId => {
        html += `
            <th style="min-width:250px">
                ${data[ldudId].vessel_name || `Vessel ${ldudId}`}
            </th>
        `;
    });

    html += `</tr>`;

    statuses.forEach(([key, title]) => {

        html += `<tr>`;

        html += `
            <td style="font-weight:bold">
                ${title}
            </td>
        `;

        Object.keys(data).forEach(ldudId => {

            const value = key ? data[ldudId][key] : [];

            let displayValue = "";

            if (Array.isArray(value))
                displayValue = value.join("<br>");
            else
                displayValue = (value === "NA" || value == null) ? "" : value;

            if (editableRows.includes(key)) {

                const savedValue = savedEdits[ldudId] && savedEdits[ldudId][key];
                const cellContent = (savedValue !== undefined && savedValue !== "")
                    ? savedValue
                    : displayValue;

                html += `
                    <td
                        contenteditable="true"
                        class="barge-editable"
                        data-ldud="${ldudId}"
                        data-status="${key}"
                        style="vertical-align:top;min-width:220px;"
                    >
                        ${cellContent}
                    </td>
                `;

            } else {

                html += `
                    <td style="vertical-align:top">
                        ${
                            Array.isArray(value)
                                ? (value.length ? value.join("<br>") : "-")
                                : (value || "-")
                        }
                    </td>
                `;
            }

        });

        html += `</tr>`;

    });

    html += `
        </table>
        </div>
    </div>
    `;

    // Remove any previously rendered barge status section only,
    // then append the fresh one — leaves the rest of the container intact.
    const existing = document.getElementById("barge-status-section");
    if (existing) {
        existing.remove();
    }
    container.innerHTML += html;

    // Delegated listener on the container (attach once)
    if (!container.dataset.bargeListenerAttached) {

        container.addEventListener("blur", function (e) {

            const cell = e.target;

            if (!cell.classList || !cell.classList.contains("barge-editable"))
                return;

            const ldudId = cell.dataset.ldud;
            const status = cell.dataset.status;
            const value = cell.innerText.trim();

            const store = JSON.parse(localStorage.getItem("bargeStatusEdits") || "{}");

            if (!store[ldudId]) {
                store[ldudId] = {};
            }
            store[ldudId][status] = value;

            localStorage.setItem("bargeStatusEdits", JSON.stringify(store));

            console.log("Saved locally:", ldudId, status, value);

        }, true);

        container.dataset.bargeListenerAttached = "true";
    }

}

function renderBargeDischargeReport(data) {

    console.log("BARGE REPORT DATA:", data);

    const container = document.getElementById('report-container');

    if (!data) {
        return;
    }

    const cargoHierarchy = data.cargo_hierarchy || {};   // cargo_type -> [cargo_categories]
    const equipmentRows = data.equipment_rows || {};      // equipment -> "type||category" -> qty
    const equipmentTotals = data.equipment_totals || {};
    const monthTotals = data.month_totals || {};
    const fyTotals = data.fy_totals || {};
    const cumulativeTotals = data.cumulative_totals || {};

    const cargoTypeOrder = [
    "IBRM",
    "CBRM",
    "FLUXES",
    "Clinker",
    "SLAG",
    "Other"
    ];

    const orderedTypes = cargoTypeOrder.filter(type => cargoHierarchy[type]);

    // Include any other cargo types not in the above list
    Object.keys(cargoHierarchy).forEach(type => {
        if (!orderedTypes.includes(type)) {
            orderedTypes.push(type);
        }
    });

    const catKey = (type, cat) => `${type}||${cat}`;
    const fmt = (n) => (n ? Number(n).toLocaleString('en-IN') : '0');

    let html = `

        <div class="report-section" style="margin-top:30px;">

            <h4>
                Barge Discharge Report
            </h4>

            <div style="overflow-x:auto;">

                <table class="report-table">

                    <!-- CARGO TYPE HEADER -->

                    <tr style="
                        background:#dfe6ee;
                        font-weight:700;
                    ">

                        <th rowspan="2"
                            style="
                                min-width:220px;
                                vertical-align:middle;
                            ">
                            Equipment Used
                        </th>
    `;

    // TOP HEADER -> CARGO TYPES
    orderedTypes.forEach(type => {

        html += `

            <th colspan="${cargoHierarchy[type].length}"
            style="
                text-align:center;
                font-size:18px;
            ">

                ${type}

            </th>
        `;
    });

    // TOP HEADER -> Total / Total-This-Month (span both header rows)
    html += `
        <th rowspan="2" style="min-width:100px; text-align:center; vertical-align:middle;">
            Total
        </th>
        <th rowspan="2" style="min-width:100px; text-align:center; vertical-align:middle;">
            Total -<br/>This Month
        </th>
    </tr><tr>`;

    // SECOND HEADER -> CARGO CATEGORIES (no cargo_name row)
    orderedTypes.forEach(type => {

        cargoHierarchy[type].forEach(category => {

            html += `

                <th style="
                    min-width:160px;
                    text-align:center;
                ">

                    ${category}

                </th>
            `;
        });
    });

    html += `</tr>`;

    // EQUIPMENT ROWS
    Object.keys(equipmentRows).forEach(equipment => {

        html += `

            <tr>

                <td style="
                    font-weight:600;
                ">

                    By ${equipment}

                </td>
        `;

        orderedTypes.forEach(type => {

            cargoHierarchy[type].forEach(category => {

                const key = catKey(type, category);
                const qty = equipmentRows[equipment][key];

                html += `

                    <td style="
                        text-align:center;
                    ">

                        ${qty ? qty.toLocaleString('en-IN') : ''}

                    </td>
                `;
            });
        });

        const rowTotals = equipmentTotals[equipment] || {};

        html += `
                <td style="text-align:center; font-weight:600;">
                    ${fmt(rowTotals.total_day)}
                </td>
                <td style="text-align:center; font-weight:600;">
                    ${fmt(rowTotals.total_month)}
                </td>
            </tr>
        `;
    });

    // ---- TOTAL FOR THE DAY ---- (grand total under "Total")
    html += `
        <tr style="background:#f5f5f5; font-weight:700;">
            <td>Total For The Day</td>
    `;

    let dayGrandTotal = 0;

    orderedTypes.forEach(type => {

        cargoHierarchy[type].forEach(category => {

            const key = catKey(type, category);
            let total = 0;

            Object.keys(equipmentRows).forEach(equipment => {
                total += Number(equipmentRows[equipment][key] || 0);
            });

            dayGrandTotal += total;

            html += `
                <td style="text-align:center;">
                    ${fmt(total)}
                </td>
            `;
        });
    });

    html += `
        <td style="text-align:center;">${fmt(dayGrandTotal)}</td>
        <td style="text-align:center;"></td>
    </tr>`;

    // ---- TOTAL RECEIPTS FOR THE MONTH ---- (grand total under "Total - This Month")
    html += `
        <tr style="background:#fff8dc; font-weight:700;">
            <td>Total Receipts for the Month</td>
    `;

    let monthGrandTotal = 0;

    orderedTypes.forEach(type => {
        cargoHierarchy[type].forEach(category => {
            const key = catKey(type, category);
            const val = monthTotals[key] || 0;
            monthGrandTotal += Number(val);
            html += `
                <td style="text-align:center;">
                    ${fmt(val)}
                </td>
            `;
        });
    });

    html += `
        <td style="text-align:center;"></td>
        <td style="text-align:center;">${fmt(monthGrandTotal)}</td>
    </tr>`;

    // ---- TOTAL RECEIPTS FY ---- (grand total under "Total", NOT "Total - This Month")
    html += `
        <tr style="background:#e8f5e9; font-weight:700;">
            <td>Total Receipts FY</td>
    `;

    let fyGrandTotal = 0;

    orderedTypes.forEach(type => {
        cargoHierarchy[type].forEach(category => {
            const key = catKey(type, category);
            const val = fyTotals[key] || 0;
            fyGrandTotal += Number(val);
            html += `
                <td style="text-align:center;">
                    ${fmt(val)}
                </td>
            `;
        });
    });

    html += `
        <td style="text-align:center;">${fmt(fyGrandTotal)}</td>
        <td style="text-align:center;"></td>
    </tr>`;

    // ---- TOTAL CUMULATIVE TILL DATE ---- (grand total under "Total", NOT "Total - This Month")
    html += `
        <tr style="background:#eef2f5; font-weight:700;">
            <td>Total Cumulative till date</td>
    `;

    let cumulativeGrandTotal = 0;

    orderedTypes.forEach(type => {
        cargoHierarchy[type].forEach(category => {
            const key = catKey(type, category);
            const val = cumulativeTotals[key] || 0;
            cumulativeGrandTotal += Number(val);
            html += `
                <td style="text-align:center;">
                    ${fmt(val)}
                </td>
            `;
        });
    });

    html += `
        <td style="text-align:center;">${fmt(cumulativeGrandTotal)}</td>
        <td style="text-align:center;"></td>
    </tr>`;

    html += `
                </table>

            </div>

        </div>
    `;

    container.innerHTML += html;
}

async function loadVesselDischargeSummary(reportDate) {

    console.log(
        "========== VESSEL DISCHARGE SUMMARY START =========="
    );

    console.log(
        "REPORT DATE:",
        reportDate
    );

    try {

        // SAFETY CHECK
        if (
            typeof reportDate !== 'string'
        ) {

            console.error(
                "INVALID REPORT DATE:",
                reportDate
            );

            return;
        }

        const apiUrl =
            `/api/module/RP01/vessel_discharge_summary?report_date=${reportDate}`;

        console.log(
            "API URL:",
            apiUrl
        );

        const response =
            await fetch(apiUrl);

        console.log(
            "FETCH RESPONSE:",
            response
        );

        console.log(
            "RESPONSE STATUS:",
            response.status
        );

        const result =
            await response.json();

        console.log(
            "FULL API RESULT:",
            result
        );

        if (!result.success) {

            console.error(
                "VESSEL DISCHARGE SUMMARY FAILED:",
                result.message
            );

            return;
        }

        console.log(
            "RESULT DATA:",
            result.data
        );

        console.log(
            "IS ARRAY:",
            Array.isArray(result.data)
        );

        if (
            !Array.isArray(result.data)
        ) {

            console.error(
                "EXPECTED ARRAY BUT GOT:",
                result.data
            );

            return;
        }

        renderVesselDischargeSummary(
            result.data
        );

    } catch (err) {

        console.error(
            "VESSEL DISCHARGE SUMMARY ERROR:",
            err
        );
    }

    console.log(
        "========== VESSEL DISCHARGE SUMMARY END =========="
    );
}

function formatDate(dateString) {
    const date = new Date(dateString + 'T00:00:00'); // avoid timezone shift
    return date.toLocaleDateString('en-GB', {
        day:   '2-digit',
        month: 'short',
        year:  'numeric'
    });
}

document
    .getElementById('download_excel_btn')
    .addEventListener('click', function () {

        console.log("========== DOWNLOAD EXCEL CLICKED ==========");

        const reportDate =
            document.getElementById('report-date').value;

        console.log("SELECTED REPORT DATE:", reportDate);

        if (!reportDate) {
            alert('Please select report date');
            return;
        }

        // Safety net: sync any cell that still has focus / hasn't blurred yet
        document.querySelectorAll(".barge-editable").forEach(cell => {

            const ldudId = cell.dataset.ldud;
            const status = cell.dataset.status;
            const value = cell.innerText.trim();

            const store = JSON.parse(localStorage.getItem("bargeStatusEdits") || "{}");

            if (!store[ldudId]) {
                store[ldudId] = {};
            }
            store[ldudId][status] = value;

            localStorage.setItem("bargeStatusEdits", JSON.stringify(store));
        });

        // Pull the barge status edits saved in localStorage
        const savedEdits =
            JSON.parse(localStorage.getItem("bargeStatusEdits") || "{}");

        console.log("SENDING BARGE EDITS:", savedEdits);

        fetch('/api/module/RP01/daily_progress_report_excel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                report_date: reportDate,
                barge_status_edits: savedEdits
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Excel generation failed');
            }
            return response.blob();
        })
        .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `daily_progress_report_${reportDate}.xlsx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            console.log("========== DOWNLOAD COMPLETE ==========");
        })
        .catch(err => {
            console.error("EXCEL DOWNLOAD ERROR:", err);
            alert('Failed to download Excel report');
        });
    });
</script>
